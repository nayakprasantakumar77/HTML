<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade Calculator</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #dff6ff;
            padding: 30px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background-color: white;
            padding: 25px;
            border: 1px solid #777;
            border-radius: 8px;
            box-shadow: 0px 4px 12px #999;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            font-size: 26px;
            color: #145a86;
        }

        .section {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #aaa;
            background-color: #f4fbff;
            border-radius: 5px;
        }

        .section h2 {
            font-size: 17px;
            margin-bottom: 12px;
            color: #145a86;
            border-bottom: 1px solid #bbb;
            padding-bottom: 5px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 9px;
            margin-bottom: 12px;
            border: 1px solid #888;
            border-radius: 4px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #145a86;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: 1px solid #145a86;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            background-color: #145a86;
            color: white;
        }

        button:hover {
            background-color: #0d4568;
        }

        .result-section {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #aaa;
            background-color: #f4fbff;
            border-radius: 5px;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-section h2 {
            color: #145a86;
            margin-bottom: 10px;
        }

        .result-item {
            margin-bottom: 10px;
            font-size: 14px;
            padding: 9px;
            border-bottom: 1px solid #ddd;
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: bold;
            color: #333;
        }

        .result-value {
            float: right;
            font-weight: bold;
            color: #145a86;
        }

        .status {
            padding: 10px;
            margin-top: 10px;
            text-align: center;
            border: 1px solid #555;
            border-radius: 4px;
            font-weight: bold;
        }

        .status.pass {
            background-color: #b9f6c3;
            color: #176b27;
        }

        .status.fail {
            background-color: #ffcdd2;
            color: #a51d2a;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Grade Calculator</h1>

        <div class="section">

            <h2>Student Information</h2>

            <label>Full Name:</label>
            <input type="text" id="name" placeholder="Enter student name">

            <label>Roll Number:</label>
            <input type="text" id="rollno" placeholder="Enter roll number">

            <label>Class:</label>
            <input type="text" id="class" placeholder="Enter class">

        </div>


    

        <div class="section">

            <h2>Subject Marks (Out of 100)</h2>

            <label>Mathematics:</label>
            <input type="number" id="math" placeholder="Enter marks">

            <label>English:</label>
            <input type="number" id="english" placeholder="Enter marks">

            <label>Science:</label>
            <input type="number" id="science" placeholder="Enter marks">

            <label>Social Studies:</label>
            <input type="number" id="social" placeholder="Enter marks">

        </div>




        <div class="button-group">

            <button onclick="calculateGrade()">
                Calculate
            </button>

            <button onclick="resetForm()">
                Reset
            </button>

        </div>




        <div class="result-section" id="resultSection">

            <h2>Results</h2>

            <div class="result-item">

                <span class="result-label">
                    Total Marks:
                </span>

                <span class="result-value" id="totalMarks">
                    -
                </span>

            </div>


            <div class="result-item">

                <span class="result-label">
                    Average:
                </span>

                <span class="result-value" id="average">
                    -
                </span>

            </div>


            <div class="result-item">

                <span class="result-label">
                    Percentage:
                </span>

                <span class="result-value" id="percentage">
                    -
                </span>

            </div>


            <div class="result-item">

                <span class="result-label">
                    Grade:
                </span>

                <span class="result-value" id="grade">
                    -
                </span>

            </div>


            <div class="status" id="statusMessage">
                -
            </div>

        </div>

    </div>


    <script>

        function calculateGrade() {

            let name = document.getElementById('name').value;

            let math = Number(
                document.getElementById('math').value
            );

            let english = Number(
                document.getElementById('english').value
            );

            let science = Number(
                document.getElementById('science').value
            );

            let social = Number(
                document.getElementById('social').value
            );

            let total = math + english + science + social;

            let avg = total / 4;

            let percent = (total / 400) * 100;


            let grade;

            if (percent >= 90) {

                grade = "A";

            } else if (percent >= 80) {

                grade = "B";

            } else if (percent >= 70) {

                grade = "C";

            } else if (percent >= 60) {

                grade = "D";

            } else {

                grade = "F";

            }


            let msg;

            if (percent >= 40) {

                msg = "PASS";

            } else {

                msg = "FAIL";

            }


            document.getElementById('totalMarks').innerText = total;

            document.getElementById('average').innerText = avg;

            document.getElementById('percentage').innerText =
                percent + "%";

            document.getElementById('grade').innerText = grade;

            document.getElementById('statusMessage').innerText =
                name + " - " + msg;


            let status =
                document.getElementById('statusMessage');


            if (msg == "PASS") {

                status.className = "status pass";

            } else {

                status.className = "status fail";

            }


            document.getElementById('resultSection')
                .classList.add('show');

        }

    </script>

</body>
</html>
