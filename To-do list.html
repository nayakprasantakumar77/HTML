
<!DOCTYPE html>
<html>

<head>

    <title>My To-Do List</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #e8f4f8;
            min-height: 100vh;
            padding: 40px 15px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;
            color: #1565c0;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        .add-task {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        #taskInput {
            flex: 1;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
        }

        #taskInput:focus {
            border-color: #2196f3;
        }

        #addBtn {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            background-color: #2196f3;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        #addBtn:hover {
            background-color: #1976d2;
        }

        .task-count {
            display: flex;
            justify-content: space-between;
            background-color: #e3f2fd;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            color: #333;
        }

        .filters {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter {
            padding: 8px 16px;
            border: 1px solid #2196f3;
            background-color: white;
            color: #2196f3;
            border-radius: 5px;
            cursor: pointer;
        }

        .filter:hover,
        .filter.active {
            background-color: #2196f3;
            color: white;
        }

        #taskList {
            list-style: none;
        }

        .task {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #f5fbff;
            border-left: 5px solid #2196f3;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        .task-text {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .task-text input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .task-name {
            font-size: 16px;
            word-break: break-word;
        }

        .task.completed {
            background-color: #e8f5e9;
            border-left-color: #4caf50;
        }

        .task.completed .task-name {
            text-decoration: line-through;
            color: #777;
        }

        .task-buttons {
            display: flex;
            gap: 5px;
            margin-left: 10px;
        }

        .edit-btn {
            background-color: #ffb300;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit-btn:hover {
            background-color: #ff8f00;
        }

        .delete-btn {
            background-color: #f44336;
            color: white;
            border: none;
            padding: 7px 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        .delete-btn:hover {
            background-color: #d32f2f;
        }

        #clearCompleted {
            width: 100%;
            margin-top: 15px;
            padding: 11px;
            border: none;
            border-radius: 6px;
            background-color: #607d8b;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        #clearCompleted:hover {
            background-color: #455a64;
        }

        #emptyMessage {
            text-align: center;
            color: #888;
            padding: 20px;
            display: none;
        }

        @media (max-width: 500px) {

            .container {
                padding: 20px;
            }

            .add-task {
                flex-direction: column;
            }

            #addBtn {
                width: 100%;
            }

            .task-count {
                flex-direction: column;
                gap: 8px;
                text-align: center;
            }

            .task {
                align-items: flex-start;
            }

            .task-buttons {
                flex-direction: column;
            }

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>PRASANTA To-Do List</h1>

        <p class="subtitle">
            Manage your daily tasks easily
        </p>

        <div class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button id="addBtn">
                Add Task
            </button>

        </div>

        <div class="task-count">

            <span>
                Total:
                <b id="totalCount">0</b>
            </span>

            <span>
                Pending:
                <b id="pendingCount">0</b>
            </span>

            <span>
                Completed:
                <b id="completedCount">0</b>
            </span>

        </div>

        <div class="filters">

            <button
                class="filter active"
                data-filter="all">
                All
            </button>

            <button
                class="filter"
                data-filter="pending">
                Pending
            </button>

            <button
                class="filter"
                data-filter="completed">
                Completed
            </button>

        </div>

        <ul id="taskList"></ul>

        <div id="emptyMessage">
            No tasks available.
        </div>

        <button id="clearCompleted">
            Clear Completed Tasks
        </button>

    </div>

    <script>

        const taskInput =
            document.getElementById("taskInput");

        const addBtn =
            document.getElementById("addBtn");

        const taskList =
            document.getElementById("taskList");

        const emptyMessage =
            document.getElementById("emptyMessage");

        const totalCount =
            document.getElementById("totalCount");

        const pendingCount =
            document.getElementById("pendingCount");

        const completedCount =
            document.getElementById("completedCount");

        const clearCompleted =
            document.getElementById("clearCompleted");

        const filterButtons =
            document.querySelectorAll(".filter");

        let tasks = [];

        let currentFilter = "all";

        const savedTasks =
            localStorage.getItem("tasks");

        if (savedTasks) {
            tasks = JSON.parse(savedTasks);
        }

        addBtn.addEventListener("click", addTask);

        taskInput.addEventListener(
            "keypress",
            function(event) {

                if (event.key === "Enter") {
                    addTask();
                }

            }
        );

        function addTask() {

            let taskName =
                taskInput.value.trim();

            if (taskName === "") {

                alert("Please enter a task!");

                return;
            }

            let task = {

                id: Date.now(),

                name: taskName,

                completed: false

            };

            tasks.push(task);

            saveTasks();

            taskInput.value = "";

            displayTasks();

        }

        function displayTasks() {

            taskList.innerHTML = "";

            let filteredTasks = [];

            if (currentFilter === "all") {

                filteredTasks = tasks;

            }

            else if (currentFilter === "pending") {

                filteredTasks =
                    tasks.filter(function(task) {

                        return task.completed === false;

                    });

            }

            else if (currentFilter === "completed") {

                filteredTasks =
                    tasks.filter(function(task) {

                        return task.completed === true;

                    });

            }

            if (filteredTasks.length === 0) {

                emptyMessage.style.display = "block";

            }

            else {

                emptyMessage.style.display = "none";

            }

            filteredTasks.forEach(function(task) {

                let li =
                    document.createElement("li");

                li.className = "task";

                if (task.completed) {

                    li.classList.add("completed");

                }

                li.innerHTML = `

                    <div class="task-text">

                        <input
                            type="checkbox"
                            ${task.completed ? "checked" : ""}
                            onchange="completeTask(${task.id})"
                        >

                        <span class="task-name">
                            ${task.name}
                        </span>

                    </div>

                    <div class="task-buttons">

                        <button
                            class="edit-btn"
                            onclick="editTask(${task.id})">
                            Edit
                        </button>

                        <button
                            class="delete-btn"
                            onclick="deleteTask(${task.id})">
                            Delete
                        </button>

                    </div>

                `;

                taskList.appendChild(li);

            });

            updateCount();

        }

        function completeTask(id) {

            tasks.forEach(function(task) {

                if (task.id === id) {

                    task.completed =
                        !task.completed;

                }

            });

            saveTasks();

            displayTasks();

        }

        function editTask(id) {

            let task =
                tasks.find(function(task) {

                    return task.id === id;

                });

            if (!task) {
                return;
            }

            let newName =
                prompt(
                    "Edit your task:",
                    task.name
                );

            if (newName === null) {
                return;
            }

            newName =
                newName.trim();

            if (newName === "") {

                alert(
                    "Task cannot be empty!"
                );

                return;
            }

            task.name = newName;

            saveTasks();

            displayTasks();

        }

        function deleteTask(id) {

            let confirmDelete =
                confirm(
                    "Do you want to delete this task?"
                );

            if (!confirmDelete) {
                return;
            }

            tasks =
                tasks.filter(function(task) {

                    return task.id !== id;

                });

            saveTasks();

            displayTasks();

        }

        filterButtons.forEach(
            function(button) {

                button.addEventListener(
                    "click",
                    function() {

                        filterButtons.forEach(
                            function(btn) {

                                btn.classList.remove(
                                    "active"
                                );

                            }
                        );

                        button.classList.add(
                            "active"
                        );

                        currentFilter =
                            button.getAttribute(
                                "data-filter"
                            );

                        displayTasks();

                    }
                );

            }
        );

        clearCompleted.addEventListener(
            "click",
            function() {

                let completed =
                    tasks.filter(
                        function(task) {

                            return task.completed;

                        }
                    );

                if (completed.length === 0) {

                    alert(
                        "There are no completed tasks!"
                    );

                    return;
                }

                let confirmClear =
                    confirm(
                        "Clear all completed tasks?"
                    );

                if (!confirmClear) {
                    return;
                }

                tasks =
                    tasks.filter(
                        function(task) {

                            return !task.completed;

                        }
                    );

                saveTasks();

                displayTasks();

            }
        );

        function updateCount() {

            let total =
                tasks.length;

            let completed =
                tasks.filter(
                    function(task) {

                        return task.completed;

                    }
                ).length;

            let pending =
                total - completed;

            totalCount.textContent =
                total;

            pendingCount.textContent =
                pending;

            completedCount.textContent =
                completed;

        }

        function saveTasks() {

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        }

        displayTasks();

    </script>

</body>

</html>
